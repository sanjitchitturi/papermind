# Render blueprint for the API. Connect the repo in the Render dashboard
# and set secret env vars there (DATABASE_URL, QDRANT_URL, QDRANT_API_KEY,
# LLM_API_KEY). Do not commit secrets.
services:
  - type: web
    name: papermind-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: CORS_ORIGINS
        value: '["https://thepapermind.vercel.app"]'
      - key: CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app"
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDING_MODEL
        value: arctic-embed-xs-int8
      - key: RERANKER_MODEL
        value: none
      - key: LOW_MEMORY
        value: "true"
      - key: ML_BATCH_SIZE
        value: "1"
      - key: MODEL_CACHE_DIR
        value: /app/.models
      - key: LLM_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
