[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
    "E501",  # line length is handled by line-length above, not worth hard-failing CI over
    "B008",  # Depends(...) in a default argument is the standard FastAPI dependency-injection pattern
]

[tool.pytest.ini_options]
pythonpath = ["."]
