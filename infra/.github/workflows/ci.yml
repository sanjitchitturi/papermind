name: CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "infra/.github/workflows/ci.yml"
  push:
    branches: [main]
  schedule:
    # Nightly run so the eval dashboard shows a trend line over time
    # instead of only updating when someone happens to touch retrieval
    # or generation code.
    - cron: "0 6 * * *"

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check app

      - name: Unit tests
        run: pytest tests/ -q

  eval-regression:
    # Only runs with real services available, and only when there's an
    # OpenAI key configured as a repo secret. Forked PRs won't have that
    # secret, so this step is expected to be skipped there rather than
    # fail noisily.
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: papermind
          POSTGRES_PASSWORD: papermind
          POSTGRES_DB: papermind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U papermind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.11.4
        ports: ["6333:6333"]
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://papermind:papermind@localhost:5432/papermind
      QDRANT_URL: http://localhost:6333
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GIT_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Skip if no API key configured
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: echo "No OPENAI_API_KEY secret configured, skipping eval run." && exit 0

      - name: Seed corpus
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: python scripts/seed_corpus.py

      - name: Run eval
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: python -m app.eval.eval_runner
